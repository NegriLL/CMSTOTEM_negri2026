#-------------------------------- Snakefile -------------------------------#
# Number of DimeMC runs to simulate
simulated_runs: 10000

# Resonant particle productions
resonant_production:
  - rho
  - phi

# Nonresonant particle productions
nonreson_productions:
  - rho
  - phi

# DimeMC Files
fortran_files:
  resonant: "dimeMC/resonant/dimemcv1.07_vsm.f"
  nonreson: "dimeMC/nonreson/dimemcv1.07.f"

# D/P/A suffix map
suffix_map:
  D: "Diagonal"
  A: "All"
  P: "Parallel"

#-------------------------------- Cuts -------------------------------#
acceptance:
  py_min: 0.18
  py_max: 0.68
 
mass_cuts:
  inv_mass_min: 2.0
  inv_mass_max: 2.5
  rho:
    mass: 0.770
    interval: 0.062
  phi:
    mass: 1.019
    interval: 0.020
 
momentum:
  px_cut: 0.130
  py_cut: 0.060
  p_cut: 1        # GeV
  momentum_cuts: false

#--------------------------- Graph Options ---------------------------#
# Style
color_palette: ROOT.kBlueRedYellow

# For more information: https://root.cern.ch/doc/v636/classTAttLine.html
line_width: 3
line_style_data: 1           # Line
line_style_resonant: 9       # Dashed Longest
line_style_nonresonant: 7    # Dashed

# Formatting
image_size:
  x: 1600
  y: 1200

legend:
  x1: 0.7
  y1: 0.7
  x2: 0.9
  y2: 0.9